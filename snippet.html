<bs-snippet name="notify" title="Join Notify" single="true"
  description="Shows the native Altspace notification when someone joins the space."
  script="https://join-notify.firer.at/snippet.js"
  join-message="{name} joined"
  leave-message="{name} left"
  notify-leaves="false"
  duration="5"
  color="#2a2a2a"
  cooldown="10"
  admins-only="false"
  join-sound="https://join-notify.firer.at/ping.ogg"
  leave-sound=""
  sound-volume="0.5"
  bundle-base="">
</bs-snippet>
