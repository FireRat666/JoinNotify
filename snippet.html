<bs-snippet name="notify" title="Join Notify" single="true"
  description="Shows native Altspace notifications and optional sounds or spoken announcements when players join."
  script="https://join-notify.firer.at/snippet.js"
  funny-messages="false"
  speak-joins="false"
  join-message="{name} joined"
  join-sound="https://join-notify.firer.at/ping.ogg"
  notify-leaves="false"
  funny-leaves="false"
  speak-leaves="false"
  leave-message="{name} left"
  leave-sound="https://join-notify.firer.at/ping.ogg"
  duration="5"
  color="#2a2a2a"
  cooldown="10"
  admins-only="false"
  sound-volume="0.5"
  bundle-base="">
</bs-snippet>
